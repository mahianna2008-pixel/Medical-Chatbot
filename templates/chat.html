<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Assistant</title>
    
    <!-- Bootstrap & FontAwesome -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <!-- External CSS Link -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}"/>
     

</head>
<marquee><h1>MEDICAL CHATBOT</h1></marquee>
<body style="background-color:rgb(235, 211, 230);">
    <div class="container chat-container">
        <div class="card">
            
            <!-- 1. Top Title Header (Doctor Image ke Upar Bold Text) -->
            <div class="header-title-box">
                <h5 class="main-title">Medical Assistant</h5>
                <p class="sub-title">
                    <i class="fas fa-heartbeat text-danger mr-1"></i>
                    Always available for your health
                </p>
            </div>

            <!-- 2. Doctor Image Avatar Section -->
            <div class="card-header text-center">
                <div class="img_cont">
                    <img src="https://img.freepik.com/free-photo/woman-doctor-wearing-lab-coat-with-stethoscope-isolated_1303-29791.jpg" class="rounded-circle user_img" alt="Doctor Avatar">
                    <span class="online_icon"></span>
                </div>
            </div>
            
            <!-- 3. Chat Messages Area -->
            <div id="messageFormeight" class="card-body msg_card_body">
                <div class="d-flex justify-content-start mb-4">
                    <div class="msg_cotainer">
                        Hello! 👋 Main aapka AI Medical Assistant hu. Aap mujhse koi bhi health ya medical query pooch sakte hain!
                        <span class="msg_time">Just now</span>
                    </div>
                </div>
            </div>

            <!-- 4. Input Field Footer -->
            <div class="card-footer">
                <form id="messageArea" class="input-group">
                    <input type="text" id="text" name="msg" placeholder="Type your health query..." autocomplete="off" class="form-control type_msg" required/>
                    <div class="input-group-append">
                        <button type="submit" id="send" class="input-group-text send_btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script>
        $(document).ready(function() {
            $("#messageArea").on("submit", function(event) {
                const date = new Date();
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');
                const str_time = hour + ":" + minute;
                var rawText = $("#text").val();

                var userHtml = '<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' + rawText + '<span class="msg_time_send">' + str_time + '</span></div></div>';
                
                $("#text").val("");
                $("#messageFormeight").append(userHtml);
                $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

                $.ajax({
                    data: { msg: rawText },
                    type: "POST",
                    url: "/get",
                }).done(function(data) {
                    var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="msg_cotainer">' + data + '<span class="msg_time">' + str_time + '</span></div></div>';
                    $("#messageFormeight").append(botHtml);
                    $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
                });
                event.preventDefault();
            });
        });
    </script>
    
</body>
</html>
